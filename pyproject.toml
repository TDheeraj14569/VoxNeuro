[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "voxneuro"
version = "0.1.0"
description = "Local research prototype for Parkinson's-associated voice feature analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "joblib>=1.4,<2",
  "librosa>=0.10.2,<1",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "praat-parselmouth>=0.4.5,<1",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "soundfile>=0.12,<1",
  "streamlit>=1.65,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.11,<1", "openpyxl>=3.1,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/voxneuro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = [".venv-audit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


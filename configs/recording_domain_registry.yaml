    feature_schema_compatibility: "voxneuro.voice.v3"
    research_evaluation_eligible: false
    candidate_compatibility_status: "CANDIDATE_TASK_COMPATIBILITY_UNVERIFIED"
    inference_eligible: false
    human_review_status: "UNREVIEWED"
    approval_status: "UNAPPROVED"

    sources:
      - source_title: "The Italian Parkinson's Voice and Speech Dataset (Dimauro & Girardi)"
        author_or_institution: "University of Bari (Dimauro & Girardi, Studi AISV 2023)"
        publication_year: 2023
        doi_or_url: "https://www.aisv.it/StudiAISV/2023/vol_11/studiAISV_11.pdf"
        dataset_repository_url: "https://ieee-dataport.org/open-access/italian-parkinsons-voice-and-speech"
        fields_supported:
          - "dataset_id"
          - "collection_site_id"
          - "country"
          - "region"
          - "language"
        verification_status: "TASK_COMPATIBILITY_UNVERIFIED"
        reviewer_notes: "65 native Italian participants: 28 PD, 22 elderly HC, 15 young HC. Speech tasks include text reading, /pa/, /ta/, and vowel phonations. Transducer hardware, original sample rate, bit depth, and channel count are not established by authoritative IPVS source. Preceding unrelated Samson Meteor microphone study (44 kHz, 16-bit, 20 cm) in same AISV publication volume must NOT be attributed to IPVS. Full pa-ta-ka DDK task not documented (/pa/ and /ta/ only). Core39 task compatibility unverified."
        source_conflicts: "Previous registry drafts conflated this 65-speaker Bari dataset with an immediately preceding unrelated Samson Meteor microphone study in the same AISV volume, as well as unrelated PoliTO/Sapienza studies (Suppa et al., Shure WH20 headset). Transducer specifications and digital audio parameters remain unknown for IPVS."

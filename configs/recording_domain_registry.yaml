    domain_name: "Italian Parkinson's Voice and Speech (IPVS) Domain"
    domain_category: "candidate_external_domain"
    dataset_id: "italian_parkinsons_voice_and_speech"
    dataset_version: "v1"
    collection_site_id: "uniba_bari"
    country: "ITA"
    region: "Apulia"
    collection_period: "historical"

    device_manufacturer: null

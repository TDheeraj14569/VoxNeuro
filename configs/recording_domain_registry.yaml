        verification_status: "VERIFIED"
        reviewer_notes: "112 participants: 54 PD and 58 healthy controls. AKG C420 headset mic, phantom-powered preamp, Creative SoundBlaster Live sound card. Recorded in quiet clinical room (not sound-treated booth, mean SNR 24.3 dB). Published in Scientific Data (Nature) 2024, DOI: 10.1038/s41597-024-04186-z, PMCID: PMC11655668."


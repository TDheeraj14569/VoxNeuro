        author_or_institution: "Hospital General Universitario Gregorio Marañón / Scientific Data (Nature)"
        publication_year: 2024
        doi_or_url: "https://doi.org/10.1038/s41597-024-04186-z"
        dataset_repository_url: "https://github.com/NeuroVoz/corpus"

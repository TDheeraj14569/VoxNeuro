registry_version: "1.0.0"
registry_schema: "voxneuro.domain_registry.v1"

# Training domains: reference development cohorts
training_domains:
  - "uams_telephone"

# Candidate external domains: independent domains assessed or under assessment
candidate_domains:
  - "neurovoz_studio"
  - "pc_gita_condenser"
  - "italian_parkinsons_headset"

# Approved domains: domains with reviewed, verified, and approved compatibility
# STRICT SAFETY INVARIANT: Must remain empty in Milestone 4 and Milestone 5.
approved_domains: []

domains:
  uams_telephone:
    domain_id: "uams_telephone"
    domain_name: "UAMS Telephone Audio Domain"
    domain_category: "training_domain"
    dataset_id: "uams_figshare_23849127"
    dataset_version: "v1"
    collection_site_id: "uams_little_rock"
    country: "USA"
    region: "Arkansas"
    collection_period: "historical"

    device_manufacturer: null
    device_model: null
    device_category: "telephone"
    microphone_type: "carbon_or_electret_telephony"
    recording_software: "telephone_network_recorder"
    recording_software_version: null

    audio_codec: "pcm_s16le"
    container_format: "wav"
    original_sample_rate: 16000
    bit_depth: 16
    channel_count: 1

    microphone_distance_cm: null
    microphone_angle_degrees: null
    automatic_gain_control: "unknown"
    noise_suppression: "unknown"
    compression_enabled: "unknown"

    recording_environment: "telephone_network"
    estimated_background_noise_db: null
    protocol_id: "uams_sustained_a_v1"
    task_type: "sustained_vowel"
    language: "en"
    dialect_metadata: "north_american"

    feature_schema_compatibility: "voxneuro.voice.v3"
    research_evaluation_eligible: true
    candidate_compatibility_status: "REFERENCE_TRAINING_CORPUS"
    inference_eligible: false
    human_review_status: "REFERENCE_COHORT"
    approval_status: "TRAINING_REFERENCE_NOT_APPROVED_FOR_INFERENCE"

    sources:
      - source_title: "VoxNeuro UAMS Voice Analysis Dataset"
        author_or_institution: "University of Arkansas for Medical Sciences (UAMS)"
        publication_year: 2023
        doi_or_url: "https://doi.org/10.6084/m9.figshare.23849127.v1"
        dataset_repository_url: "https://figshare.com/articles/dataset/VoxNeuro_UAMS/23849127"
        fields_supported:
          - "device_category"
          - "microphone_type"
          - "original_sample_rate"
          - "bit_depth"
          - "channel_count"
          - "task_type"
          - "language"

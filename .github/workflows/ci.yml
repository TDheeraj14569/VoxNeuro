name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-test:
    name: Python 3.12 Tests & Quality Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies via locked requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Install package in editable mode
        run: python -m pip install --no-deps -e .

      - name: Run Ruff Linter
        run: python -m ruff check .

      - name: Run Ruff Format Check
        run: python -m ruff format --check .

      - name: Run Architecture & Code Verifier
        env:
          PYTHONPATH: src
        run: python scripts/verify_project.py

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: src
        run: python -m pytest -v --cov=src/voxneuro --cov-fail-under=85

  frontend-test:
    name: Frontend Three.js Visualizer Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/acoustic-visualizer
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/acoustic-visualizer/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run Visualizer Unit Tests
        run: npm test

      - name: Verify Three.js Bundle Build
        run: npm run build

      - name: Verify Committed Bundle Consistency
        run: git diff --exit-code dist/

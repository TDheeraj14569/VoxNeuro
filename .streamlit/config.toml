[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 25
enableCORS = true
enableXsrfProtection = true

[theme]
base = "dark"
primaryColor = "#55D9C1"
backgroundColor = "#07131B"
secondaryBackgroundColor = "#0C1D27"
textColor = "#F3F7F5"
font = "sans serif"

[browser]
gatherUsageStats = false

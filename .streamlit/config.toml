[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 25
enableCORS = true
enableXsrfProtection = true

[theme]
base = "light"
primaryColor = "#B95E46"
backgroundColor = "#F3F0E8"
secondaryBackgroundColor = "#EBE7DE"
textColor = "#20232B"
font = "sans serif"

[browser]
gatherUsageStats = false

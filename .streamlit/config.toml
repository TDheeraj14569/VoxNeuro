[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 25
enableCORS = true
enableXsrfProtection = true

[theme]
base = "light"
primaryColor = "#176B5B"
backgroundColor = "#F5F6F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2724"
font = "sans serif"

[browser]
gatherUsageStats = false

